<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Who Likes You · TUDO</title>
  <meta name="description" content="See who liked you on TUDO." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M20 34c-6-4-10-8-10-13 0-3.4 2.7-5.6 5.6-5.6 2 0 3.5 1 4.4 2.6.9-1.6 2.4-2.6 4.4-2.6 2.9 0 5.6 2.2 5.6 5.6 0 5-4 9-10 13Z' fill='%2318A679'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link rel="preconnect" href="https://images.unsplash.com" />
  <link rel="stylesheet" href="assets/css/style.css" /><link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body>
  <div data-nav></div>
  <main class="section section--tight" style="padding-top:calc(var(--nav-h) + 24px)">
    <div class="wrap">
      <p class="eyebrow">Admirers</p>
      <h1 class="h2" style="margin:0 0 .4rem">People who like you</h1>
      <p class="muted mb-3"><span class="gold" id="likeCount">12</span> people have liked your profile. Upgrade to see them all clearly.</p>
      <div class="glass flex between items-center wrap-f mb-3" style="padding:1rem 1.2rem">
        <span>🔒 Reveal everyone who liked you with <strong>TUDO Premium</strong>.</span>
        <a class="btn btn--gold btn--sm" href="premium.html">Go Premium</a>
      </div>
      <div class="grid profiles-grid" id="likesGrid"></div>
    </div>
  </main>
  <div data-bottomnav></div>
  <div data-footer></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/matching.js"></script>
  <script>(function(){
    boot('likes.html'); renderBottomNav('likes.html');
    // Feature real-photo women first (shown unblurred), then others behind the Premium blur
    const featured = ['p45','p55','p61','p53','p29','p60','p49','p31','p57','p63','p42','p65'];
    const byId = id => PROFILES.find(p => p.id === id);
    const admirers = featured.map(byId).filter(Boolean);
    document.getElementById('likeCount').textContent = admirers.length;
    document.getElementById('likesGrid').innerHTML = admirers.map((p,i)=>{
      const locked = i>2;
      return `<article class="pcard" style="${locked?'':''}">
        <a class="pcard__img" href="${locked?'premium.html':'profile.html?id='+p.id}" style="background-image:url('${p.img}');aspect-ratio:3/4;${locked?'filter:blur(14px) saturate(.8)':''}">
          <div class="pcard__top">${locked?'<span class="chip chip--gold">🔒 Premium</span>':'<span class="chip">Likes you</span>'}<span class="match-ring">${p.match}%</span></div>
          ${locked?'':`<div class="pcard__body"><h3 class="pcard__name" style="font-size:1.2rem">${p.name}, ${p.age}</h3><p class="pcard__meta" style="margin:0">${p.city}</p></div>`}
        </a>
        ${locked?'':`<div class="pcard__actions" style="padding:0 1rem 1rem"><button class="btn btn--ghost btn--sm btn--block" data-pass="${p.id}">Pass</button><button class="btn btn--primary btn--sm btn--block" data-like="${p.id}">Like back</button></div>`}
      </article>`;
    }).join('');
    document.getElementById('likesGrid').addEventListener('click', e=>{
      const l=e.target.closest('[data-like]'), p=e.target.closest('[data-pass]');
      if(l){ e.preventDefault(); toast("It's a match! Say hello 👋",'heart'); }
      if(p){ e.preventDefault(); p.closest('.pcard').style.opacity='.35'; }
    });
  
})();</script>
</body>
</html>
