<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Success Stories · TUDO</title>
  <meta name="description" content="Real-feeling stories of Bangladeshi couples who met on TUDO. (Demo names shown as examples.)" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M20 34c-6-4-10-8-10-13 0-3.4 2.7-5.6 5.6-5.6 2 0 3.5 1 4.4 2.6.9-1.6 2.4-2.6 4.4-2.6 2.9 0 5.6 2.2 5.6 5.6 0 5-4 9-10 13Z' fill='%2318A679'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://images.unsplash.com" />
  <link rel="stylesheet" href="assets/css/style.css" /><link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body>
  <div data-nav></div>
  <main style="padding-top:calc(var(--nav-h) + 40px)">
    <section class="section section--tight">
      <div class="wrap center" style="max-width:720px">
        <p class="eyebrow" style="justify-content:center">Success stories</p>
        <h1 class="display" style="font-size:clamp(2.4rem,5vw,4rem)">Some stories begin with a <span class="serif-accent grad-text">simple hello</span>.</h1>
        <p class="lead" style="margin-inline:auto">Real connections, worldwide. The names below are illustrative examples until we publish verified testimonials.</p>
      </div>
    </section>
    <section class="section" style="padding-top:0"><div class="wrap grid cols-2" id="storyGrid" style="gap:1.6rem"></div></section>
    <section class="section section--tight"><div class="wrap panel center" data-reveal>
      <h2 class="h2">Your story could be next.</h2>
      <p class="lead" style="margin-inline:auto">Join thousands of Bangladeshi singles looking for something real.</p>
      <a class="btn btn--primary btn--lg mt-1" href="register.html" data-magnetic>Create Free Profile</a>
    </div></section>
  </main>
  <div data-footer></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/matching.js"></script>
  <script>(function(){
    boot('success-stories.html');
    const more = [...STORIES, ...STORIES.map(s=>({...s, names:s.names.split(' & ').reverse().join(' & ')}))].slice(0,6);
    document.getElementById('storyGrid').innerHTML = STORIES.concat(STORIES.slice(0,2)).map((s,i)=>`
      <article class="card" data-reveal data-reveal-delay="${i%2}">
        <div class="story__img" style="background-image:url('${s.img}');aspect-ratio:16/9"></div>
        <div class="chip chip--gold mt-2 mb-1">${s.milestone}</div>
        <h2 class="h3">${s.names}</h2>
        <p class="text-sm muted" style="margin:0 0 .6rem">${s.loc}</p>
        <p class="serif-accent" style="font-size:1.1rem;line-height:1.55">${s.text}</p>
      </article>`).join('');
    document.getElementById('storyGrid').querySelectorAll('[data-reveal]').forEach(e=>e.classList.add('in'));
  
})();</script>
</body>
</html>
