<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Notifications · TUDO</title>
  <meta name="description" content="Your TUDO notifications and preferences." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M20 34c-6-4-10-8-10-13 0-3.4 2.7-5.6 5.6-5.6 2 0 3.5 1 4.4 2.6.9-1.6 2.4-2.6 4.4-2.6 2.9 0 5.6 2.2 5.6 5.6 0 5-4 9-10 13Z' fill='%2318A679'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="assets/css/style.css" /><link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body>
  <div data-nav></div>
  <main class="section section--tight" style="padding-top:calc(var(--nav-h) + 24px)">
    <div class="wrap" style="max-width:760px">
      <div class="flex between items-center mb-2"><div><p class="eyebrow">Activity</p><h1 class="h2" style="margin:0">Notifications</h1></div><button class="btn btn--ghost btn--sm" id="markAll">Mark all read</button></div>
      <div class="panel" id="notifList" style="padding:0"></div>
      <a class="text-sm gold" href="settings.html" style="display:inline-block;margin-top:1rem">Manage notification preferences →</a>
    </div>
  </main>
  <div data-bottomnav></div>
  <div data-footer></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/matching.js"></script>
  <script>(function(){
    boot(''); renderBottomNav('');
    const list = document.getElementById('notifList');
    const draw = () => list.innerHTML = NOTIFICATIONS.map((n,i)=>`
      <div class="flex gap-1 items-center" style="padding:1rem 1.2rem;border-bottom:1px solid var(--line);${n.unread?'background:rgba(24,166,121,.05)':''}" data-i="${i}">
        <span class="act" style="width:44px;height:44px;flex:none">${ICON[n.icon]||ICON.heart}</span>
        <div style="flex:1"><strong>${n.title}</strong><p class="muted text-sm" style="margin:0">${n.body}</p></div>
        <span class="text-xs muted">${n.time}</span>${n.unread?'<span style="width:9px;height:9px;border-radius:50%;background:var(--tudo-green-soft)"></span>':''}
      </div>`).join('');
    draw();
    document.getElementById('markAll').onclick = ()=>{ NOTIFICATIONS.forEach(n=>n.unread=false); draw(); toast('All caught up.','check'); };
  
})();</script>
</body>
</html>
