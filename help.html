<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Help Centre · TUDO</title>
  <meta name="description" content="Find answers about getting started, matching, messaging, premium, verification, safety and privacy on TUDO." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M20 34c-6-4-10-8-10-13 0-3.4 2.7-5.6 5.6-5.6 2 0 3.5 1 4.4 2.6.9-1.6 2.4-2.6 4.4-2.6 2.9 0 5.6 2.2 5.6 5.6 0 5-4 9-10 13Z' fill='%2318A679'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="assets/css/style.css" /><link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body>
  <div data-nav></div>
  <main style="padding-top:calc(var(--nav-h) + 30px)">
    <section class="section section--tight"><div class="wrap center" style="max-width:640px">
      <p class="eyebrow" style="justify-content:center">Help Centre</p>
      <h1 class="h2">How can we help?</h1>
      <input class="input mt-1" placeholder="Search help articles…" id="helpSearch" style="max-width:440px;margin-inline:auto"/>
    </div></section>
    <section class="section" style="padding-top:0"><div class="wrap grid cols-3" id="helpCats"></div></section>
    <section class="section section--tight"><div class="wrap panel" style="max-width:680px;margin-inline:auto">
      <h2 class="h3">Still need help? Contact support</h2>
      <form id="supportForm" class="mt-2">
        <div class="grid cols-2" style="gap:1rem"><div class="field"><label>Name</label><input class="input" name="name" required/><span class="error-msg"></span></div><div class="field"><label>Email</label><input class="input" name="email" type="email" required/><span class="error-msg"></span></div></div>
        <div class="grid cols-2" style="gap:1rem"><div class="field"><label>Category</label><select class="select" name="category"><option>Getting Started</option><option>Profile</option><option>Matching</option><option>Messaging</option><option>Premium</option><option>Verification</option><option>Safety</option><option>Privacy</option><option>Technical Problems</option></select></div><div class="field"><label>Subject</label><input class="input" name="subject"/></div></div>
        <div class="field"><label>Message</label><textarea class="textarea" name="message" required></textarea><span class="error-msg"></span></div>
        <div class="field"><label>Attachment <span class="muted">(optional)</span></label><input class="input" type="file"/></div>
        <button class="btn btn--primary btn--block">Submit ticket</button>
      </form>
    </div></section>
  </main>
  <div data-footer></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/matching.js"></script>
  <script>(function(){
    boot('');
    const cats = [['🚀','Getting Started','Create your profile and find your feet.'],['👤','Profile','Photos, bio, prompts and completion.'],['💚','Matching','Likes, Sparks, compatibility and matches.'],['💬','Messaging','Chat, safety and conversation starters.'],['⭐','Premium','Plans, billing and features.'],['🛡️','Verification','Email, phone and photo verification.'],['🔒','Safety','Staying safe on and off TUDO.'],['🕵️','Privacy','Control who sees your information.'],['🛠️','Technical Problems','App issues and troubleshooting.']];
    const host=document.getElementById('helpCats');
    const draw=(q='')=>host.innerHTML=cats.filter(c=>(c[1]+c[2]).toLowerCase().includes(q)).map((c,i)=>`<a href="#" class="card card--hover" data-reveal data-reveal-delay="${i%3}"><div style="font-size:1.6rem">${c[0]}</div><h3 class="h3" style="font-size:1.15rem;margin-top:.3rem">${c[1]}</h3><p class="muted text-sm">${c[2]}</p></a>`).join('')||'<p class="muted">No articles match your search.</p>';
    draw(); host.querySelectorAll('[data-reveal]').forEach(e=>e.classList.add('in'));
    document.getElementById('helpSearch').addEventListener('input',e=>{draw(e.target.value.toLowerCase());host.querySelectorAll('[data-reveal]').forEach(x=>x.classList.add('in'));});
    host.addEventListener('click',e=>{if(e.target.closest('a')){e.preventDefault();toast('Article opening (demo).','check');}});
    document.getElementById('supportForm').addEventListener('submit',e=>{e.preventDefault();let ok=true;[...e.target.querySelectorAll('[required]')].forEach(x=>{const bad=!x.value.trim();x.closest('.field').classList.toggle('field--error',bad);if(bad)ok=false;});if(!ok)return;e.target.reset();toast('Ticket submitted — we\'ll reply by email.','check');});
  
})();</script>
</body>
</html>
