<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Discover People · TUDO</title>
  <meta name="description" content="Discover verified Bangladeshi singles near you and around the world. Like, Spark and match on TUDO." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M20 34c-6-4-10-8-10-13 0-3.4 2.7-5.6 5.6-5.6 2 0 3.5 1 4.4 2.6.9-1.6 2.4-2.6 4.4-2.6 2.9 0 5.6 2.2 5.6 5.6 0 5-4 9-10 13Z' fill='%2318A679'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://images.unsplash.com" />
  <link rel="stylesheet" href="assets/css/style.css" /><link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body>
  <div data-nav></div>
  <main style="padding-top:calc(var(--nav-h) + 28px)" class="section section--tight">
    <div class="wrap">
      <div class="flex between items-center wrap-f mb-2">
        <div>
          <p class="eyebrow">Discover people</p>
          <h1 class="h2" style="margin:0">People you may like</h1>
          <p class="muted text-sm" id="filterNote" style="margin:.4rem 0 0"></p>
        </div>
        <div class="flex gap-1 wrap-f">
          <a class="btn btn--ghost btn--sm" href="search.html">⚙ Filters</a>
          <div class="lang" style="display:inline-flex" role="group" aria-label="View">
            <button class="active" id="viewGrid">Grid</button><button id="viewDeck">Cards</button>
          </div>
        </div>
      </div>

      <p class="text-xs muted mb-2 desktop-only">Tip: use ← pass · → like · ↑ Spark · F favourite</p>

      <!-- Grid (desktop default) -->
      <div class="grid profiles-grid" id="discover-grid"></div>

      <!-- Deck (mobile / cards view) -->
      <div id="discover-deck" class="deck hide" aria-live="polite"></div>

      <div class="empty" id="discover-empty" hidden>
        <div class="empty__icon">💚</div>
        <h2 class="h3">No matches yet.</h2>
        <p class="muted">Your person might be one profile away. Try widening your filters.</p>
        <a class="btn btn--primary mt-2" href="search.html">Adjust filters</a>
      </div>
    </div>
  </main>
  <div data-bottomnav></div>
  <div data-footer></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/matching.js"></script>
  <script src="assets/js/discover.js"></script>
  <script>(function(){
    renderBottomNav('discover.html');
    const grid = document.getElementById('discover-grid'), deck = document.getElementById('discover-deck');
    const g = document.getElementById('viewGrid'), d = document.getElementById('viewDeck');
    const setView = (view) => {
      const isDeck = view === 'deck';
      grid.classList.toggle('hide', isDeck); deck.classList.toggle('hide', !isDeck);
      const pg = document.getElementById('discover-pagination'); if (pg) pg.classList.toggle('hide', isDeck);
      g.classList.toggle('active', !isDeck); d.classList.toggle('active', isDeck);
    };
    g.addEventListener('click', () => setView('grid'));
    d.addEventListener('click', () => setView('deck'));
    if (matchMedia('(max-width:640px)').matches) setView('deck');
  
})();</script>
</body>
</html>
