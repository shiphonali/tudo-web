<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TUDO Admin · Dashboard</title>
  <meta name="description" content="TUDO administration dashboard." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M20 34c-6-4-10-8-10-13 0-3.4 2.7-5.6 5.6-5.6 2 0 3.5 1 4.4 2.6.9-1.6 2.4-2.6 4.4-2.6 2.9 0 5.6 2.2 5.6 5.6 0 5-4 9-10 13Z' fill='%2318A679'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://images.unsplash.com" />
  <link rel="stylesheet" href="assets/css/style.css" /><link rel="stylesheet" href="assets/css/responsive.css" />
  <style>
    .admin{display:grid;grid-template-columns:250px 1fr;min-height:100svh}
    .admin__side{border-right:1px solid var(--line);padding:1.2rem;position:sticky;top:0;height:100svh;overflow-y:auto;background:var(--tudo-surface)}
    #adminNav button{display:block;width:100%;text-align:left;padding:.6rem .9rem;border-radius:10px;border:0;background:none;color:var(--text-muted);font-weight:600;font-family:var(--font-display);cursor:pointer;transition:all .15s;font-size:.92rem}
    #adminNav button:hover{color:var(--text);background:rgba(248,246,240,.04)}
    #adminNav button.active{background:rgba(24,166,121,.14);color:var(--tudo-green-soft)}
    .admin__main{padding:clamp(18px,3vw,34px);min-width:0}
    .admin table th{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);padding:.5rem .4rem}
    .admin__side .switch{width:48px;height:28px}
    @media(max-width:820px){.admin{grid-template-columns:1fr}.admin__side{position:fixed;z-index:150;transform:translateX(-100%);transition:transform .4s var(--e-out);width:250px}.admin__side.open{transform:none}.admin__bar{display:flex !important}}
    .admin__bar{display:none;position:sticky;top:0;z-index:120;align-items:center;gap:.6rem;padding:.7rem 1rem;background:var(--glass-strong);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  </style>
</head>
<body>
  <div class="admin">
    <aside class="admin__side" id="adminDrawer">
      <a class="logo" href="index.html" style="margin-bottom:1.2rem"><span class="logo__mark"></span>TU<b>DO</b></a>
      <span class="chip chip--gold mb-2" style="margin-bottom:1rem">Admin</span>
      <nav id="adminNav" aria-label="Admin"></nav>
      <div class="divider mt-3 mb-2"></div>
      <div class="lang" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="bn" class="bn">বাংলা</button></div>
      <a href="index.html" class="text-sm muted" style="display:block;margin-top:1rem">← Back to site</a>
    </aside>
    <div class="admin__main">
      <div class="admin__bar">
        <button class="btn btn--icon btn--ghost" id="adminMenu" aria-label="Menu">☰</button>
        <strong>TUDO Admin</strong>
      </div>
      <div class="flex between items-center wrap-f mb-3">
        <div><p class="eyebrow" style="margin-bottom:.2rem">Administration</p><h1 class="h2" id="adminTitle" style="margin:0">Dashboard</h1></div>
        <div class="flex items-center gap-1"><input class="input" placeholder="Search…" style="max-width:200px"/><div class="avatar" style="width:40px;height:40px;background-image:url('assets/images/men/hasan.jpg')"></div></div>
      </div>
      <div id="adminView"></div>
    </div>
  </div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/matching.js"></script>
  <script src="assets/js/admin.js"></script>
  <script>(function(){
    mountLogos();
  
})();</script>
</body>
</html>
